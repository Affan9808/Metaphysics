<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Metaphysics & Its Descendants</title>
<meta name="theme-color" content="#0c0c0c" />
<meta name="description" content="A personal reference tool on metaphysics, worldview, politics, religion, and Islam." />

<!-- iOS "Add to Home Screen" support -->
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Metaphysics" />

<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.json" />

<style>
  html, body { margin:0; padding:0; height:100%; background:#0c0c0c; overscroll-behavior:none; }
  #root { height:100%; }

  /* ── Boot / loading screen ─────────────────────────────────────── */
  #boot {
    height:100%; position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(212,168,67,0.10) 0%, rgba(12,12,12,0) 55%),
      #0c0c0c;
    font-family:Georgia,'Times New Roman',serif;
  }
  /* scattered starfield, pure CSS — a grid of faint dots at random-feeling offsets */
  #boot::before {
    content:""; position:absolute; inset:0; opacity:0.5;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #d4a843 0, transparent 100%),
      radial-gradient(1px 1px at 27% 64%, #e8e0d0 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 41% 29%, #d4a843 0, transparent 100%),
      radial-gradient(1px 1px at 58% 76%, #e8e0d0 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 73% 15%, #d4a843 0, transparent 100%),
      radial-gradient(1px 1px at 84% 58%, #e8e0d0 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 19% 85%, #d4a843 0, transparent 100%),
      radial-gradient(1px 1px at 91% 33%, #e8e0d0 0, transparent 100%),
      radial-gradient(1px 1px at 64% 92%, #d4a843 0, transparent 100%),
      radial-gradient(1px 1px at 35% 8%, #e8e0d0 0, transparent 100%);
    animation: boot-twinkle 3.2s ease-in-out infinite;
  }
  @keyframes boot-twinkle {
    0%, 100% { opacity:0.35; }
    50%      { opacity:0.7; }
  }
  .boot-glyph {
    width:52px; height:52px;
    filter: drop-shadow(0 0 14px rgba(212,168,67,0.55));
    animation: boot-pulse 2.1s ease-in-out infinite;
    z-index:1;
  }
  @keyframes boot-pulse {
    0%, 100% { transform:scale(1);    opacity:0.85; }
    50%      { transform:scale(1.1); opacity:1;    }
  }
  .boot-title {
    margin-top:22px; font-size:12px; letter-spacing:5px; color:#c8bfa8;
    text-transform:uppercase; z-index:1; opacity:0;
    animation: boot-fade-in 1.4s ease-out 0.3s forwards;
  }
  .boot-sub {
    margin-top:9px; font-size:9px; letter-spacing:3px; color:#5a5648;
    z-index:1; opacity:0;
    animation: boot-fade-in 1.4s ease-out 0.7s forwards;
  }
  @keyframes boot-fade-in {
    from { opacity:0; transform:translateY(4px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .boot-track {
    margin-top:20px; width:120px; height:2px; border-radius:2px;
    background:#1c1c1c; overflow:hidden; z-index:1;
  }
  .boot-track::after {
    content:""; display:block; height:100%; width:40%; border-radius:2px;
    background:linear-gradient(90deg, transparent, #d4a843, transparent);
    animation: boot-sweep 1.6s ease-in-out infinite;
  }
  @keyframes boot-sweep {
    0%   { transform:translateX(-120%); }
    100% { transform:translateX(340%); }
  }
</style>

<!-- Maps the bare specifiers used inside metaphysics-explorer.jsx ("react", "react-dom/client")
     to real ES module URLs, since browsers can't resolve bare package names on their own. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>

<!-- Babel Standalone: transforms JSX (and ES module import/export) to plain JS,
     entirely in the browser, at page-load time. This is what lets a single .jsx
     file run with zero build step, zero npm install, zero bundler. -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
  <div id="root">
    <div id="boot">
      <svg class="boot-glyph" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#d4a843" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M100,58 C88,48 66,44 46,48 L46,140 C66,136 88,140 100,150"/>
          <path d="M100,58 C112,48 134,44 154,48 L154,140 C134,136 112,140 100,150"/>
          <line x1="100" y1="58" x2="100" y2="150"/>
        </g>
        <path d="M76,38 L100,20 L124,38" fill="none" stroke="#d4a843" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
      </svg>
      <div class="boot-title">Metaphysics &amp; Its Descendants</div>
      <div class="boot-sub">LOADING</div>
      <div class="boot-track"></div>
    </div>
  </div>

  <!-- data-type="module" tells Babel Standalone this script (and anything it imports
       via relative paths, like ./metaphysics-explorer.jsx) should be transformed and
       run as a real ES module. This is the piece that makes the existing file's
       "import { useState } from react" and "export default function ..." work
       completely unmodified. -->
  <script type="text/babel" data-type="module" data-presets="react">
    import { createRoot } from "react-dom/client";
    import MetaphysicsExplorer from "./metaphysics-explorer.jsx";
    createRoot(document.getElementById("root")).render(<MetaphysicsExplorer />);
  </script>
</body>
</html>
